<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ShopHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/login.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <a href="../index.html" class="logo">Shop<span>Hub</span></a>
      <div class="search">
        <input type="text" placeholder="Search products, brands, vendors..." />
        <button class="search__btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </button>
      </div>
      <nav class="header__actions">
        <a href="#" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          <span class="badge">3</span>
        </a>
        <a href="register.html" class="btn btn--primary btn--sm">Sign Up</a>
      </nav>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- AUTH LAYOUT -->
  <main class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <a href="../index.html" class="logo">Shop<span>Hub</span></a>
      </div>
      <h1>Welcome back</h1>
      <p class="auth__sub">Sign in to your account to continue shopping.</p>

      <form class="auth__form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" aria-label="Show password">👁</button>
          </div>
        </div>

        <div class="auth__row">
          <label class="check"><input type="checkbox" /> <span>Remember me</span></label>
          <a href="forgot-password.html" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg">Sign In</button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="socials">
        <button class="social-btn">🔵 Google</button>
        <button class="social-btn">🔷 Facebook</button>
      </div>

      <p class="auth__foot">
        Don't have an account? <a href="register.html" class="link">Create one</a>
      </p>
    </div>

    <div class="auth__side">
      <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&q=80" alt="Shopping" />
      <div class="auth__side-content">
        <h2>Shop smarter with ShopHub</h2>
        <p>Thousands of vendors, millions of products, delivered to your door.</p>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script>
    // Password show/hide
    const pwd = document.getElementById('password');
    document.querySelector('.password-toggle')?.addEventListener('click', function () {
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
      this.textContent = pwd.type === 'password' ? '👁' : '🙈';
    });
  </script>

</body>
</html>
