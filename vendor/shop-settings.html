<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Settings — ShopHub Seller Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/vendor-shared.css" />
  <link rel="stylesheet" href="../assets/css/vendor-add-product.css" />
</head>
<body class="vendor-body">
  <div class="vendor-layout">
    <aside class="v-sidebar" id="vSidebar">
      <div class="v-brand"><a href="../index.html" class="logo">Shop<span>Hub</span></a><span class="v-brand-badge">Seller</span></div>
      <div class="v-shop-mini"><img src="https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=80&q=80" alt="Shop" /><div><strong>TechZone</strong><span>Active Shop</span></div></div>
      <nav class="v-nav">
        <a href="dashboard.html" class="v-link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
        <a href="products.html" class="v-link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4 8 4 8-4z"/><path d="M4 7v10l8 4 8-4V7"/><path d="M12 11v10"/></svg>Products</a>
        <a href="orders.html" class="v-link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>Orders<span class="v-badge">4</span></a>
        <a href="earnings.html" class="v-link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Earnings</a>
        <a href="reviews.html" class="v-link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Reviews</a>
        <div class="v-divider"></div>
        <div class="v-nav-label">Settings</div>
        <a href="shop-settings.html" class="v-link active"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Shop Settings</a>
        <div class="v-divider"></div>
        <a href="login.html" class="v-link v-link--danger" id="vLogout"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
      </nav>
    </aside>

    <div class="v-main">
      <header class="v-topbar">
        <button class="v-menu-toggle" id="vMenuToggle"><span></span><span></span><span></span></button>
        <div class="v-search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="Search..." /></div>
        <div class="v-topbar-right">
          <button class="v-icon-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="v-dot"></span></button>
          <a href="shop-settings.html" class="v-user"><img src="https://i.pravatar.cc/80?img=12" alt="User" /><strong>John Doe</strong></a>
        </div>
      </header>

      <div class="v-content">
        <div class="v-pagehead">
          <div><h1>Shop Settings</h1><p>Manage your shop appearance and policies</p></div>
        </div>

        <form class="settings-form" id="settingsForm">
          <!-- Branding -->
          <div class="v-card">
            <div class="v-card-head"><h2>Shop Branding</h2></div>
            <div class="brand-grid">
              <div class="brand-item">
                <label class="upload-area" for="logoInput">
                  <div class="upload-area__icon">🏪</div>
                  <strong>Shop Logo</strong>
                  <span>400×400px recommended</span>
                  <input type="file" id="logoInput" accept="image/*" />
                </label>
                <img id="logoPreview" src="https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=200&q=80" alt="" class="brand-preview" />
              </div>
              <div class="brand-item">
                <label class="upload-area" for="coverInput">
                  <div class="upload-area__icon">🖼️</div>
                  <strong>Cover Banner</strong>
                  <span>1200×300px recommended</span>
                  <input type="file" id="coverInput" accept="image/*" />
                </label>
                <img id="coverPreview" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=400&q=80" alt="" class="brand-preview brand-preview--wide" />
              </div>
            </div>
          </div>

          <!-- Basic -->
          <div class="v-card">
            <div class="v-card-head"><h2>Shop Information</h2></div>
            <div class="form-grid">
              <div class="field field--full">
                <label>Shop name *</label>
                <input type="text" value="TechZone" />
              </div>
              <div class="field">
                <label>Category</label>
                <select><option>Electronics</option><option>Fashion</option><option>Home & Living</option></select>
              </div>
              <div class="field">
                <label>Phone</label>
                <input type="tel" value="+880 1712 345678" />
              </div>
              <div class="field field--full">
                <label>Shop description</label>
                <textarea rows="3">Premium electronics & gadgets — trusted by 50,000+ customers.</textarea>
              </div>
            </div>
          </div>

          <!-- Policies -->
          <div class="v-card">
            <div class="v-card-head"><h2>Policies</h2></div>
            <div class="form-grid">
              <div class="field field--full">
                <label>Shipping policy</label>
                <textarea rows="2">Standard delivery within Dhaka takes 24–48 hours. Free shipping over $50.</textarea>
              </div>
              <div class="field field--full">
                <label>Return policy</label>
                <textarea rows="2">7-day easy returns. Items must be unused and in original packaging.</textarea>
              </div>
              <div class="field field--full">
                <label>Warranty info</label>
                <textarea rows="2">All products come with full manufacturer warranty.</textarea>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn--ghost">Cancel</button>
            <button type="submit" class="btn btn--primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="v-overlay" id="vOverlay"></div>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/vendor-shared.js"></script>
  <script>
    document.getElementById('logoInput')?.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => document.getElementById('logoPreview').src = ev.target.result;
      r.readAsDataURL(f);
    });
    document.getElementById('coverInput')?.addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => document.getElementById('coverPreview').src = ev.target.result;
      r.readAsDataURL(f);
    });
    document.getElementById('settingsForm')?.addEventListener('submit', e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const t = btn.textContent;
      btn.textContent = 'Saving...';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = t;
        btn.disabled = false;
        showVToast('Settings saved');
      }, 700);
    });
  </script>
</body>
</html>
